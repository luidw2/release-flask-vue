<!DOCTYPE html>
<html>
<head><title>支付成功</title></head>
<body>
    <h1>支付成功</h1>
    <p>订单号：{{ order_id }}</p>
    <p>交易号：{{ transaction_id }}</p>
    <p>金额：¥{{ "%.2f" % (amount/100) }}</p>
    <p>账户余额：¥{{ "%.2f" % (balance/100) }}</p>
    <!-- 返回前端首页：由 FRONTEND_BASE_URL 配置；生产必须是 https，前后端同源时可留空走相对路径 -->
    <a href="{{ frontend_base_url }}/user/products/profile">返回首页</a>
</body>
</html>
