<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>安全支付</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', Arial;
            background: linear-gradient(135deg, #ffffff 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 25px;
            text-align: center;
            color: white;
        }
        .header h1 { font-size: 24px; }
        .content { padding: 30px; }

        .info-grid {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #ddd;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #888; }
        .info-value { color: #333; font-weight: 500; }
        .amount { font-size: 28px; color: #e74c3c; font-weight: bold; }

        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4facfe;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-cancel {
            background: #f5f5f5;
            color: #666;
        }
        .btn-confirm {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .tip {
            margin-top: 20px;
            padding: 12px;
            background: #e7f3ff;
            border-radius: 8px;
            font-size: 13px;
            color: #0c63e4;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>🏦 安全支付</h1>
            <p>请登录银行账户确认支付</p>
        </div>

        <div class="content">
            <div class="info-grid">
                <div class="info-row">
                    <span class="info-label">订单号</span>
                    <span class="info-value">{{ order_id }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">商户</span>
                    <span class="info-value">{{ merchant_name }}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">支付金额</span>
                    <span class="info-value amount">¥{{ amount }}</span>
                </div>
            </div>

            <form action="/pay/process" method="POST">
                <div class="form-group">
                    <label>银行用户名</label>
                    <input type="text" name="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label>银行密码</label>
                    <input type="password" name="password" placeholder="请输入密码" required>
                </div>

                <!-- 隐藏字段 -->
                <input type="hidden" name="order_id" value="{{ order_id }}">
                <input type="hidden" name="amount" value="{{ amount.replace('.', '') }}">
                <input type="hidden" name="transaction_id" value="{{ transaction_id }}">

                <div class="btn-group">
                    <button type="button" class="btn btn-cancel" onclick="window.history.back()">返回</button>
                    <button type="submit" class="btn btn-confirm">确认支付</button>
                </div>
            </form>

            <div class="tip">
                <strong>测试账号：</strong><br>
                用户名：test<br>
                密码：123456
            </div>
        </div>
    </div>
</body>
</html>
